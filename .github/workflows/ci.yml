# Ongoing CI for NACC's own code (as opposed to
# foundation-audit.yml, which audits upstream AgentPanel at a pinned SHA
# and is Phase 0 evidence, not ongoing CI).
#
# Windows-only by directive (see docs/adr/0001-foundation-selection.md).
# Step order matters: Rust steps run BEFORE the frontend build, because
# `cargo test` regenerates the gitignored ../src/bindings.ts that
# the frontend build type-checks against (see
# src-tauri/tests/export_bindings.rs).
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache cargo registry + git + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nacc-ci-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            nacc-ci-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (workspace, deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test (workspace) -- also regenerates src/bindings.ts
        run: cargo test --workspace --all-features

      - name: Diagnose export_bindings.exe if the test step failed
        if: failure()
        run: |
          $exe = Get-ChildItem -Path "target/debug/deps" -Filter "export_bindings-*.exe" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $exe) {
            Write-Host "No export_bindings-*.exe found under target/debug/deps"
          } else {
            Write-Host "Inspecting: $($exe.FullName)"
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            $dumpbin = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Recurse -Filter "dumpbin.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like "*Hostx64\x64*" } | Select-Object -First 1
            if ($dumpbin) {
              Write-Host "--- dumpbin /dependents ---"
              & $dumpbin.FullName /dependents $exe.FullName
            } else {
              Write-Host "dumpbin.exe not found"
            }
          }

      - name: Confirm bindings.ts was regenerated
        run: |
          if (-not (Test-Path "src/bindings.ts")) {
            Write-Error "src/bindings.ts was not produced by cargo test -- export_bindings.rs did not run or failed silently"
            exit 1
          }
          Write-Host "src/bindings.ts present, $((Get-Item src/bindings.ts).Length) bytes"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Frontend build (tsc + vite) -- type-checks against the real generated bindings
        run: npm run build

      - name: Frontend tests (Vitest)
        run: npm test

      - name: Tauri production build (NSIS installer, real signed updater artifacts)
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Locate build outputs
        run: |
          Get-ChildItem -Recurse -Path "src-tauri/target/release/bundle" -ErrorAction SilentlyContinue |
            Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload NSIS installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nacc-windows-installer-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: warn
          retention-days: 14
