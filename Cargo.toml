[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/nacc-domain",
    "crates/nacc-storage",
    "crates/nacc-events",
    "crates/nacc-orchestrator",
    "crates/nacc-provider-core",
    "crates/nacc-provider-claude",
    "crates/nacc-provider-codex",
    "crates/nacc-provider-antigravity",
    "crates/nacc-provider-copilot",
    "crates/nacc-provider-opencode",
    "crates/nacc-process",
    "crates/nacc-runtime",
    "crates/nacc-worktree",
    "crates/nacc-git",
    "crates/nacc-github",
    "crates/nacc-policy",
    "crates/nacc-quality",
    "crates/nacc-review",
    "crates/nacc-secrets",
    "crates/nacc-observability",
    "crates/nacc-updater",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
# The real floor, driven by specta 2.0.0-rc.25's use of std::fmt::from_fn
# (stable since 1.93.0) -- not just Tauri 2.12's own 1.90 MSRV bump. See
# rust-toolchain.toml's comment for the full chain of reasoning; this is
# also what `get_app_diagnostics` reports via CARGO_PKG_RUST_VERSION.
rust-version = "1.93"
license = "MIT"
publish = false

# Versions verified directly against crates.io on 2026-08-30 (see
# docs/adr/0001-foundation-selection.md and docs/audits/foundation-audit.md
# for the verification method this workspace follows). Only dependencies
# actually used by a Phase 1/2 crate are pinned here; crates needed by later
# phases (portable-pty, notify, reqwest, keyring, secrecy, zeroize, ...) are
# deliberately NOT pre-declared -- they get verified fresh, at the point
# they are actually adopted, per the master plan's "discover/validate
# dynamically, don't hard-code" principle (S2.7).
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
async-trait = "0.1.92"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "process", "io-util"] }
# Phase 2 storage. rusqlite over sqlx: verified via crates.io on
# 2026-08-30 -- rusqlite 0.40.2 (31.5M recent downloads, updated 2026-08-08)
# is a thin, synchronous, direct binding over the same libsqlite3-sys C
# bindings sqlx itself uses, with no compile-time query-cache/build-time
# coupling (sqlx's headline feature needs a live DB or committed
# `.sqlx/` offline cache at build time -- exactly the kind of exotic
# build-time surface this workspace's own CI history says to avoid; see
# the STATUS_ENTRYPOINT_NOT_FOUND and workspace-target-path incidents in
# docs/architecture/overview.md). NACC is a single-process, single-user
# desktop app ("one local SQLite database per NACC user profile", master
# plan S4.4) with no concurrent-multi-client story sqlx's async pool is
# built for, so synchronous rusqlite calls wrapped in
# `tokio::task::spawn_blocking` (nacc-storage's own pattern, documented
# there) are the simpler, equally-correct fit. "bundled" statically links
# SQLite into the binary -- no separate system DLL for a signed installer
# to depend on.
rusqlite = { version = "0.40.2", features = ["bundled"] }
# 2.6.0, 2.2M recent downloads, updated 2026-05-28 -- embedded, versioned,
# transactional migrations tracked via SQLite's own `user_version` pragma,
# matching master plan S4.4's wording exactly ("embedded, versioned,
# transactional where SQLite permits").
rusqlite_migration = "2.6.0"

tauri = "2.11.5"
tauri-build = "2.6.3" # default features include config-json, required since tauri.conf.json is JSON
tauri-plugin-updater = "2.10.1"
# "uuid" enables specta's Type impl for uuid::Uuid, which nacc-domain's
# define_id! macro wraps directly -- without it, cargo clippy fails with
# `error[E0277]: the trait specta::Type is not implemented for uuid::Uuid`
# (found via this workspace's own CI, not anticipated in advance).
# "derive" is explicit here rather than relied on via feature unification
# from tauri-specta's own specta dependency, which does not request it.
specta = { version = "=2.0.0-rc.25", features = ["derive", "uuid"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }

nacc-domain = { path = "crates/nacc-domain" }
nacc-storage = { path = "crates/nacc-storage" }
nacc-events = { path = "crates/nacc-events" }
nacc-orchestrator = { path = "crates/nacc-orchestrator" }
nacc-provider-core = { path = "crates/nacc-provider-core" }
nacc-provider-claude = { path = "crates/nacc-provider-claude" }
nacc-provider-codex = { path = "crates/nacc-provider-codex" }
nacc-provider-antigravity = { path = "crates/nacc-provider-antigravity" }
nacc-provider-copilot = { path = "crates/nacc-provider-copilot" }
nacc-provider-opencode = { path = "crates/nacc-provider-opencode" }
nacc-process = { path = "crates/nacc-process" }
nacc-runtime = { path = "crates/nacc-runtime" }
nacc-worktree = { path = "crates/nacc-worktree" }
nacc-git = { path = "crates/nacc-git" }
nacc-github = { path = "crates/nacc-github" }
nacc-policy = { path = "crates/nacc-policy" }
nacc-quality = { path = "crates/nacc-quality" }
nacc-review = { path = "crates/nacc-review" }
nacc-secrets = { path = "crates/nacc-secrets" }
nacc-observability = { path = "crates/nacc-observability" }
nacc-updater = { path = "crates/nacc-updater" }

[profile.release]
panic = "unwind"   # a provider-adapter panic must not crash the whole app; caught at the process/task boundary
lto = true
codegen-units = 1
strip = true

[profile.dev]
panic = "unwind"
