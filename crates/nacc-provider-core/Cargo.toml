[package]
name = "nacc-provider-core"
description = "The AgentProvider contract every provider adapter implements, plus normalized capability/event types (master plan S8). Depends only on nacc-domain -- concrete providers depend on this, never the reverse."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nacc-domain = { workspace = true }
# Phase 4: the contained-command runner every adapter executes through
# (`ProcessCommandRunner`). nacc-process is a generic process API with no
# knowledge of any provider CLI, so this keeps the crate's "nothing here
# knows about a specific CLI" property while still giving adapters one
# shared, contained execution path instead of five ad-hoc ones.
nacc-process = { workspace = true }
# Recorded CLI fixtures (`cli.rs`) are JSON, and the contract suite's
# findings are serialized by callers -- serde_json is a real dependency of
# this crate since Phase 4, not only a test convenience.
serde_json = { workspace = true }
# `session.rs` spawns the background task that awaits a launched provider CLI
# and emits its terminal event, so the adapters' shared plumbing needs the
# runtime directly.
tokio = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
specta = { workspace = true }


