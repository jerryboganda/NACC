# Manual Windows desktop packaging evidence (master plan Phase 12).
# workflow_dispatch only: a full Tauri bundle is exactly the kind of heavy
# compute that belongs in GitHub Actions, not on developer machines or the
# production VPS.
#
# tauri.conf.json intentionally has createUpdaterArtifacts=true. Tauri therefore
# requires an updater signing key even for a non-release build. This workflow
# creates a throwaway updater key only to prove the packaging contract; it is
# never persisted or published. The uploaded NSIS installer is still NOT a
# production release because it has no Windows Authenticode signature.

name: desktop-build

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Tauri packaging evidence (NSIS, non-distributable)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Generate ephemeral updater key for build evidence only
        shell: pwsh
        run: |
          npx --yes @tauri-apps/cli signer generate -w $env:RUNNER_TEMP/nacc-build-evidence-key --password ""
          $key = Get-Content $env:RUNNER_TEMP/nacc-build-evidence-key -Raw
          "TAURI_SIGNING_PRIVATE_KEY=$key" >> $env:GITHUB_ENV
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> $env:GITHUB_ENV
      - name: Build Windows NSIS package
        run: npx tauri build
        env:
          CI: true
      - name: Verify expected build outputs and discard ephemeral updater artifacts
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/release/bundle/nsis/*.exe -ErrorAction Stop)
          if ($installers.Count -ne 1) {
            throw "expected exactly one NSIS installer; got $($installers.Count)"
          }

          $expectedSignature = "$($installers[0].FullName).sig"
          if (-not (Test-Path $expectedSignature -PathType Leaf)) {
            throw "Tauri updater signature was not produced for $($installers[0].Name)"
          }
          if ((Get-Item $expectedSignature).Length -le 0) {
            throw "Tauri updater signature is empty"
          }

          # This updater signature is created with a throwaway key and MUST NOT
          # be consumed by users or uploaded as a release asset.
          Remove-Item $expectedSignature -Force
      - uses: actions/upload-artifact@v4
        with:
          name: nacc-windows-unsigned-build-evidence
          path: |
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
