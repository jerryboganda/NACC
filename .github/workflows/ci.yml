# Ongoing CI for NACC's own code (as opposed to
# foundation-audit.yml, which audits upstream AgentPanel at a pinned SHA
# and is Phase 0 evidence, not ongoing CI).
#
# Windows-only by directive (see docs/adr/0001-foundation-selection.md).
# Step order matters: Rust steps run BEFORE the frontend build, because
# `cargo run -- --export-bindings` regenerates the gitignored
# ../src/bindings.ts that the frontend build type-checks against (see
# src-tauri/src/main.rs's --export-bindings flag).
#
# Build output lands at the WORKSPACE ROOT's target/release/bundle, not
# src-tauri/target/release/bundle -- this repo is a Cargo workspace (root
# Cargo.toml, resolver = "2"), unlike upstream AgentPanel's standalone
# single-crate layout that foundation-audit.yml correctly builds against
# a src-tauri/target path. Confirmed the hard way: an earlier version of
# this file looked in src-tauri/target/release/bundle, found nothing, and
# `if-no-files-found: warn` let the step report success while silently
# uploading no installer at all -- caught by actually downloading the
# artifact list via `gh api .../artifacts` after a "green" run, not by
# trusting the step's own checkmark. `if-no-files-found` is now `error`
# so this class of bug fails loudly instead of silently.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache cargo registry + git + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nacc-ci-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            nacc-ci-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (workspace, deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test (workspace)
        run: cargo test --workspace --all-features

      - name: Generate src/bindings.ts (cargo run -- --export-bindings)
        run: cargo run -p nacc-app -- --export-bindings

      - name: Confirm bindings.ts was regenerated
        run: |
          if (-not (Test-Path "src/bindings.ts")) {
            Write-Error "src/bindings.ts was not produced by --export-bindings"
            exit 1
          }
          Write-Host "src/bindings.ts present, $((Get-Item src/bindings.ts).Length) bytes"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Frontend build (tsc + vite) -- type-checks against the real generated bindings
        run: npm run build

      - name: Frontend tests (Vitest)
        run: npm test

      - name: Tauri production build (NSIS installer, real signed updater artifacts)
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Locate build outputs
        run: |
          Get-ChildItem -Recurse -Path "target/release/bundle" -ErrorAction SilentlyContinue |
            Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload NSIS installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nacc-windows-installer-${{ github.sha }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 14
