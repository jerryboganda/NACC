# NACC CI (master plan §18's verification gate, moved off developer machines
# per the compute policy: heavy builds and test batteries run here, on
# GitHub's Windows runners — never on the production VPS, and on a local
# machine only when CI cannot do the job).
#
# The rust-msvc job is the one the local machine could never deliver: the
# local environment links GNU only (missing Windows SDK libs), so MSVC
# correctness was explicitly unverified until this workflow exists.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  frontend:
    name: frontend build + vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  bindings:
    name: generated bindings are fresh
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      # src/bindings.ts is generated, never hand-written. If this diff is
      # non-empty, someone changed a Rust command signature without
      # regenerating — fail rather than let the drift reach the frontend.
      - run: cargo run -p nacc-app -- --export-bindings
      - run: git diff --exit-code -- src/bindings.ts

  rust-msvc:
    name: clippy + tests (MSVC)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  rust-gnu:
    name: clippy + tests (GNU — local-toolchain parity)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned GNU toolchain (with clippy — components are per-toolchain)
        run: rustup toolchain install 1.96.0-x86_64-pc-windows-gnu --component clippy --component rustfmt
      - name: Show the MinGW linker the GNU toolchain will use
        run: gcc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.96.0-x86_64-pc-windows-gnu clippy --workspace --all-targets -- -D warnings
      - run: cargo +1.96.0-x86_64-pc-windows-gnu test --workspace
