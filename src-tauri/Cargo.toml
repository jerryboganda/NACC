[package]
name = "nacc-app"
description = "Native Agent Control Center -- Tauri 2 desktop shell and composition root wiring every NACC crate together."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "nacc_app_lib"
# staticlib/cdylib are mobile-target boilerplate (Android/iOS need them to
# embed the Rust core into a native shell) copied reflexively from a
# typical Tauri scaffold. This project has no mobile target -- master
# plan: "Windows 10/11, Windows-first with later Linux/macOS
# portability" -- and the extra crate-types caused a real, reproducible
# failure: `cargo test`'s export_bindings integration test crashed with
# `STATUS_ENTRYPOINT_NOT_FOUND` (0xc0000139), a classic symptom of
# Windows DLL-export ambiguity when a crate is built as cdylib +
# something else and a test binary links against it. Plain rlib is all
# an integration test (or any future mobile target, added deliberately
# and re-verified when it is actually needed) requires.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = ["codegen"] }

[dependencies]
tauri = { workspace = true }
tauri-plugin-updater = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true }
tracing-appender = { workspace = true }

# Every NACC library crate is wired into the composition root here, even
# where a crate is not yet called from any command (most are Phase 1
# boundary-only stubs -- see each crate's own doc comment for its target
# phase). This keeps `cargo tree` an honest picture of the intended final
# application shape rather than 20 floating, disconnected libraries.
nacc-domain = { workspace = true }
nacc-observability = { workspace = true }
nacc-storage = { workspace = true }
nacc-events = { workspace = true }
nacc-orchestrator = { workspace = true }
nacc-provider-core = { workspace = true }
nacc-provider-claude = { workspace = true }
nacc-provider-codex = { workspace = true }
nacc-provider-antigravity = { workspace = true }
nacc-provider-copilot = { workspace = true }
nacc-provider-opencode = { workspace = true }
nacc-process = { workspace = true }
nacc-runtime = { workspace = true }
nacc-worktree = { workspace = true }
nacc-git = { workspace = true }
nacc-github = { workspace = true }
nacc-policy = { workspace = true }
nacc-quality = { workspace = true }
nacc-review = { workspace = true }
nacc-secrets = { workspace = true }
nacc-updater = { workspace = true }
